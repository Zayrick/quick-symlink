name: Release

# Publishes a signed DMG to GitHub Releases.
#   - Automatically when RELEASE.md changes on main: the first "# <version>" line is the version,
#     everything below it is the release notes. Skipped if that version's tag already exists.
#   - Manually from the Actions tab: enter a version; release notes are the commit titles since the last tag.
on:
  push:
    branches: [main]
    paths: [RELEASE.md]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.2.3
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version and release notes
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
            if last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null)"; then
              range="$last_tag..HEAD"
            else
              range=HEAD
            fi
            git log "$range" --no-merges --format='- %s' > "$notes"
          else
            version="$(awk '/^#[[:space:]]/ { sub(/^#[[:space:]]+v?/, ""); print $1; exit }' RELEASE.md)"
            awk 'found { print } /^#[[:space:]]/ { found = 1 }' RELEASE.md > "$notes"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::Invalid version: '$version'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::error::Tag v$version already exists"
              exit 1
            fi
            echo "::notice::Tag v$version already exists, nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "Version: $version"; cat "$notes"

      - name: Select newest Xcode
        if: steps.meta.outputs.skip != 'true'
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Import signing certificate
        id: cert
        if: steps.meta.outputs.skip != 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::warning::MACOS_CERTIFICATE_P12 is not set, the app will be signed ad-hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identities="$(security find-identity -v -p codesigning "$keychain")"
          identity="$(printf '%s\n' "$identities" | grep -oE '"Developer ID Application[^"]*"' | head -n 1 | tr -d '"')"
          [ -n "$identity" ] || identity="$(printf '%s\n' "$identities" | grep -oE '"[^"]+"' | head -n 1 | tr -d '"')"
          if [ -z "$identity" ]; then
            echo "::error::No code signing identity found in MACOS_CERTIFICATE_P12"
            exit 1
          fi
          echo "Signing identity: $identity"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        if: steps.meta.outputs.skip != 'true'
        env:
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          case "$SIGN_IDENTITY" in
            "Developer ID Application"*) ;;
            *) unset NOTARY_APPLE_ID NOTARY_PASSWORD NOTARY_TEAM_ID
               echo "::warning::Not notarizing: requires a Developer ID Application certificate" ;;
          esac
          Scripts/package-dmg.sh "${{ steps.meta.outputs.version }}" "$GITHUB_RUN_NUMBER"

      - name: Publish release
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "v$VERSION" "build/Quick-Symlink-$VERSION.dmg" \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "${{ steps.meta.outputs.notes }}"

      - name: Remove signing keychain
        if: always() && steps.cert.outputs.keychain != ''
        run: security delete-keychain "${{ steps.cert.outputs.keychain }}"
